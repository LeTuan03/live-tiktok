name: web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format (Biome)
        run: npx biome ci

      # The design tokens (web/styles/tokens.css, web/lib/branding/) and the
      # typed API client (web/lib/api/generated/) are committed artifacts, so
      # the build runs from them directly with no codegen step.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
