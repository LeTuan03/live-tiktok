[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveflow-ai-studio"
version = "1.0.0"
description = "AI-powered TikTok Live Commerce Studio"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.7.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiohttp>=3.9.0",
    "openai>=1.30.0",
    "edge-tts>=6.1.0",
    "obsws-python>=1.7.0",
    "keyring>=25.2.0",
    "loguru>=0.7.0",
    "aiofiles>=23.2.0",
    "Pillow>=10.3.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "pyinstaller>=6.6.0",
]

[project.scripts]
liveflow = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
