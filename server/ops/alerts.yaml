# Prometheus alerting rules for the SoShop server runtime.
#
# Pair this file with the example dashboards in server/ops/grafana/.
#
# Provisioning:
# - Grafana-managed Alertmanager: point its alerting provisioning
#   directory at this file.
# - Self-hosted Prometheus: drop into `/etc/prometheus/rules.d/` and
#   reference it from `prometheus.yml > rule_files`.
#
# The room-cap threshold is parameterised against your machine scale plan
# (50 concurrent rooms in this example). Update the threshold together with
# the dashboard `$rooms_cap` template variable when your plan changes.

groups:
  - name: soshop-server-runtime
    interval: 30s
    rules:
      - alert: SoShopRoomsNearCap
        expr: sum(soshop_active_rooms) / 50 >= 0.8
        for: 2m
        labels:
          severity: warning
          service: soshop-server
          component: livekit
        annotations:
          summary: "Concurrent LiveKit rooms at or above 80% of cap"
          description: |
            {{ $value | humanize }} rooms are active, which is at or above
            80% of the 50-room cap. Investigate before the cap is hit and
            new dispatches start failing.
          runbook: "https://github.com/lemonsliceai/SoShop/blob/main/server/README.md"

      - alert: SoShopPersonaSwapP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, swap_mode) (rate(soshop_persona_swap_seconds_bucket[5m]))
          ) > 6
        for: 5m
        labels:
          severity: critical
          service: soshop-server
          component: persona-swap
        annotations:
          summary: "p95 persona swap latency > 6s ({{ $labels.swap_mode }})"
          description: |
            p95 persona-swap latency for swap_mode={{ $labels.swap_mode }}
            has been above the 6s SLO for 5 minutes
            (current: {{ $value | humanizeDuration }}).
          runbook: "https://github.com/lemonsliceai/SoShop/blob/main/server/README.md"

      - alert: SoShopDispatchErrorRateHigh
        expr: |
          sum(rate(soshop_dispatch_errors_total[5m]))
            / clamp_min(sum(rate(soshop_dispatch_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: critical
          service: soshop-server
          component: livekit-dispatch
        annotations:
          summary: "LiveKit dispatch error rate > 5%"
          description: |
            Dispatch error rate has been above 5% for 5 minutes
            (current: {{ $value | humanizePercentage }}). Check LiveKit
            cloud status and recent deploys before paging on-call.
          runbook: "https://github.com/lemonsliceai/SoShop/blob/main/server/README.md"
