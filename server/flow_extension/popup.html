<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
      .dot.on { background: #16a34a; }
      input { width: 100%; box-sizing: border-box; padding: 5px; font: inherit; }
      button { padding: 5px 10px; font: inherit; cursor: pointer; }
      .err { color: #b91c1c; }
      .muted { color: #6b7280; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>SoShop Flow Bridge</h1>
    <div class="row"><span id="dot" class="dot"></span><span id="state">Đang kiểm tra...</span></div>
    <p id="error" class="err"></p>
    <label class="muted" for="server">Địa chỉ server SoShop</label>
    <input id="server" spellcheck="false" />
    <div class="row">
      <button id="save">Lưu và kết nối lại</button>
      <button id="flow">Mở Flow</button>
    </div>
    <p class="muted">
      Server tạo video sẽ điều khiển tab flow.google.com bằng tài khoản và tín dụng Flow của bạn.
      Giữ một tab Flow mở trong lúc tạo video.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
