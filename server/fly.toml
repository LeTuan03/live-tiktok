app = "soshop-api"
primary_region = "sjc"

[build]
  # `Dockerfile` (the default) is now the LiveKit Agents worker — see
  # `livekit.toml`. The Fly.io machine runs the FastAPI uvicorn process,
  # so pin its build to the explicit `Dockerfile.api`.
  dockerfile = "Dockerfile.api"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
